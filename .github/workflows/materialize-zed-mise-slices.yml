          source = Path('source')
          stage = Path('/tmp/den1462-materialized')
          shutil.rmtree(stage, ignore_errors=True)
          stage.mkdir(parents=True)
          def lines(*args):
              out = subprocess.check_output(['git','-C',str(source),*args], text=True)
              return [line for line in out.splitlines() if line]
          changed = set(lines('diff','--name-only','--diff-filter=ACMRTUXB','HEAD'))
          changed.update(lines('ls-files','--others','--exclude-standard'))
          deleted = sorted(set(lines('diff','--name-only','--diff-filter=D','HEAD')))
          changed = sorted(changed)
          for rel in changed:
              src = source / rel
              if not src.is_file(): raise SystemExit(f'not a regular file: {rel}')
              dst = stage / 'files' / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          (stage/'base-sha.txt').write_text(subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'], text=True))
          (stage/'changed-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          (stage/'deleted-files.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''))
          with tarfile.open('/tmp/den1462-materialized.tar.gz','w:gz') as archive:
              archive.add(stage, arcname='den1462-materialized')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den1462-materialized
          path: /tmp/den1462-materialized.tar.gz
          if-no-files-found: error
          retention-days: 7
