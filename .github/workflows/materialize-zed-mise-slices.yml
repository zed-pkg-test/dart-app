name: materialize zed mise slices

on:
  pull_request:
    paths:
      - .github/workflows/materialize-zed-mise-slices.yml

permissions:
  contents: read

concurrency:
  group: materialize-zed-mise-slices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lock-contract:
    name: DEN-1461
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: bc0ae69e85677a55cd7e695c92298310880adfcc
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Materialize and validate
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/apply_den1461_current_wire.py
          python3 scripts/harden_den1461_lock.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked --lib mise_lock::tests
          cargo test --locked --test mise_lock_contract
          cargo clippy --locked --all-targets -- -D warnings
          rm -f \
            .github/workflows/harden-den-1461-lock-order.yml \
            .github/workflows/apply-den-1461-current-wire.yml \
            scripts/apply_den1461_current_wire.py \
            scripts/harden_den1461_lock.py
      - name: Package validated delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess, tarfile
          source = Path('source')
          stage = Path('/tmp/den1461-materialized')
          shutil.rmtree(stage, ignore_errors=True)
          stage.mkdir(parents=True)
          def lines(*args):
              out = subprocess.check_output(['git','-C',str(source),*args], text=True)
              return [line for line in out.splitlines() if line]
          changed = set(lines('diff','--name-only','--diff-filter=ACMRTUXB','HEAD'))
          changed.update(lines('ls-files','--others','--exclude-standard'))
          deleted = sorted(set(lines('diff','--name-only','--diff-filter=D','HEAD')))
          changed = sorted(changed)
          for rel in changed:
              src = source / rel
              if not src.is_file(): raise SystemExit(f'not a regular file: {rel}')
              dst = stage / 'files' / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          (stage/'base-sha.txt').write_text(subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'], text=True))
          (stage/'changed-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          (stage/'deleted-files.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''))
          with tarfile.open('/tmp/den1461-materialized.tar.gz','w:gz') as archive:
              archive.add(stage, arcname='den1461-materialized')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den1461-materialized
          path: /tmp/den1461-materialized.tar.gz
          if-no-files-found: error
          retention-days: 7

  mise-export:
