        with:
          repository: zed-pkg/zed-cli
          ref: b69cbe0aff8eee89580b6e3c618897e404a8c0fc
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Materialize and validate
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/apply_den1462_mise_export.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked mise_export
          cargo test --locked --test mise_export_cli
          cargo test --locked cli::tests::environment_export_is_typed_and_rejects_ambiguous_write_modes
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo clippy --locked --all-targets -- -D warnings
          rm -f .github/workflows/apply-den-1462-mise-export.yml scripts/apply_den1462_mise_export.py
      - name: Package validated delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
